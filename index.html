<style>
/* Full-width page: Systeme.io container ki side spacing hatao */
html {
  overflow-x: hidden !important;
  background: #050909 !important;
}

body {
  margin: 0 !important;
  overflow-x: hidden !important;
  background: #050909 !important;
}

#hs-page {
  display: block !important;
  width: 100vw !important;
  max-width: 100vw !important;
  min-width: 0 !important;
  margin-left: calc(50% - 50vw) !important;
  margin-right: calc(50% - 50vw) !important;
  border: 0 !important;
  outline: 0 !important;
  box-shadow: none !important;
  overflow: hidden !important;
  background: #050909 !important;
}

/* Seedhi grid lines aur light beams hatao */
#hs-page .hs-grid,
#hs-page .hs-beam {
  display: none !important;
}

/* Soft moving lights wala background */
#hs-page .hs-bg {
  background:
    radial-gradient(circle at 50% 12%, #254b45 0%, transparent 42%),
    radial-gradient(circle at 75% 55%, #3d2b21 0%, transparent 40%),
    #050909 !important;
}

#hs-page .hs-bg:before {
  top: -180px !important;
  left: -230px !important;
  width: 520px !important;
  height: 520px !important;
  background: radial-gradient(circle, #1cc7a476, transparent 68%) !important;
  filter: blur(75px) !important;
}

#hs-page .hs-bg:after {
  top: 35% !important;
  right: -230px !important;
  width: 480px !important;
  height: 480px !important;
  background: radial-gradient(circle, #e68d4770, transparent 68%) !important;
  filter: blur(85px) !important;
}

/* Sections par koi white border nahi */
#hs-page .hs-nav,
#hs-page .hs-strip,
#hs-page .hs-footer {
  border-color: #cba96e38 !important;
}

@media (max-width: 700px) {
  #hs-page .hs-wrap {
    width: calc(100% - 32px) !important;
    max-width: 100% !important;
  }

  #hs-page .hs-nav {
    min-height: 58px !important;
    gap: 8px !important;
    font-size: 10px !important;
  }

  #hs-page .hs-nav small {
    font-size: 8px !important;
    text-align: right !important;
  }

  #hs-page .hs-hero {
    padding: 43px 0 64px !important;
  }

  #hs-page .hs-chip {
    max-width: 100% !important;
    padding: 8px 12px !important;
    font-size: 9px !important;
    letter-spacing: 1px !important;
  }

  #hs-page .hs-logo {
    width: 170px !important;
    height: 170px !important;
    margin: 27px auto 28px !important;
  }

  #hs-page .hs-logo img {
    width: 135px !important;
    height: 135px !important;
  }

  #hs-page .hs-overline {
    font-size: 9px !important;
    letter-spacing: 1.5px !important;
    line-height: 1.6 !important;
  }

  #hs-page h1 {
    width: 100% !important;
    max-width: 100% !important;
    margin: 13px auto 17px !important;
    font-size: clamp(35px, 9.5vw, 47px) !important;
    line-height: 1.12 !important;
    letter-spacing: -1.5px !important;
    overflow-wrap: break-word !important;
  }

  #hs-page h1 span {
    display: block !important;
  }

  #hs-page .hs-lead {
    max-width: 100% !important;
    font-size: 13px !important;
    line-height: 1.75 !important;
  }

  #hs-page .hs-button {
    width: 100% !important;
    max-width: 330px !important;
    min-height: 53px !important;
    padding: 13px 15px !important;
    font-size: 10px !important;
    letter-spacing: .5px !important;
  }

  #hs-page .hs-note {
    font-size: 9px !important;
    line-height: 1.8 !important;
  }

  #hs-page .hs-strip {
    padding: 13px 8px !important;
    font-size: 8px !important;
    line-height: 1.8 !important;
    letter-spacing: .3px !important;
  }

  #hs-page .hs-section {
    padding: 58px 0 45px !important;
  }

  #hs-page h2 {
    font-size: 30px !important;
    line-height: 1.22 !important;
  }

  #hs-page .hs-cards {
    grid-template-columns: 1fr !important;
    gap: 13px !important;
  }

  #hs-page .hs-card {
    min-height: 0 !important;
    padding: 21px !important;
  }

  #hs-page .hs-feature {
    grid-template-columns: 1fr !important;
    gap: 13px !important;
    margin-top: 46px !important;
    padding: 24px 20px !important;
  }

  #hs-page .hs-final {
    padding: 55px 0 72px !important;
  }
}
</style>

<script>
/* Custom HTML block mein viewport setting missing ho to add karo */
(function () {
  if (!document.querySelector('meta[name="viewport"]')) {
    var viewport = document.createElement('meta');
    viewport.name = 'viewport';
    viewport.content = 'width=device-width, initial-scale=1';
    document.head.appendChild(viewport);
  }
})();
</script>
